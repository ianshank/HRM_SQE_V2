# Single GPU ARC training config (adapted for GTX 1660 Ti 6GB)

defaults:
  - arch: hrm_v1
  - _self_

hydra:
  output_subdir: null

# Data path - using reduced augmentation dataset
data_path: data/arc-aug-100

# Hyperparams - Training (adapted for single GPU)
# Reduced from 768 to fit in 6GB VRAM
global_batch_size: 96

# More frequent evaluation for single GPU training
epochs: 100000
eval_interval: 5000
checkpoint_every_eval: True

# Learning rates
lr: 1e-4
lr_min_ratio: 1.0
lr_warmup_steps: 1000

# Standard hyperparameter settings for LM
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
puzzle_emb_weight_decay: 0.1

# Hyperparams - Puzzle embeddings training
puzzle_emb_lr: 1e-2

# Seed for reproducibility
seed: 42
